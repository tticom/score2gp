name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out private real-source corpus
        uses: actions/checkout@v4
        with:
          repository: tticom/score2gp-private-fixtures
          ssh-key: ${{ secrets.SCORE2GP_PRIVATE_FIXTURES_DEPLOY_KEY }}
          path: .private-fixtures
          persist-credentials: false
      - name: Mount and verify required real-source fixtures
        run: |
          (cd .private-fixtures && python scripts/fixture_audit.py)
          mkdir -p fixtures/private
          cp -a .private-fixtures/fixtures/private/. fixtures/private/
          test -s fixtures/private/Lesson-5.pdf
          test -s fixtures/private/Lesson-6.pdf
          test -s "fixtures/private/Derek Trucks BB King.gp"
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run unit and mandatory real-source tests
        run: python -m pytest
      - name: Run repository hygiene audit
        run: python scripts/artifact_audit.py
